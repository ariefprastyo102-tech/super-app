<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#1f2937;
}

.app{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    padding-bottom:90px;
}

/* HEADER */

.header{
    background:linear-gradient(
        135deg,
        #0d5c36,
        #176b3a,
        #23834d
    );

    color:white;
    padding:22px 20px 24px;
    border-radius:0 0 22px 22px;

    box-shadow:
        0 6px 18px rgba(0,0,0,.12);
}

.header small{
    font-size:12px;
    opacity:.85;
}

.header h1{
    margin-top:5px;
    font-size:27px;
    font-weight:800;
}

.header p{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}

/* CONTENT */

.content{
    padding:20px 16px;
}

.section-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:14px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.menu-card{
    border:none;
    background:white;
    border-radius:17px;
    padding:18px 13px;
    min-height:105px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:9px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    cursor:pointer;

    transition:
        transform .12s ease,
        box-shadow .12s ease;
}

.menu-card:active{
    transform:scale(.96);
}

.menu-icon{
    font-size:30px;
}

.menu-name{
    text-align:center;
    font-size:13px;
    font-weight:700;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    z-index:50;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    max-width:600px;
    height:72px;

    background:white;

    display:grid;
    grid-template-columns:1fr 1fr 1fr;

    border-top:1px solid #e5e7eb;

    box-shadow:
        0 -4px 18px rgba(0,0,0,.08);
}

.nav-item{
    border:none;
    background:none;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    color:#64748b;

    font-size:11px;
    font-weight:700;

    cursor:pointer;
}

.nav-icon{
    font-size:21px;
}

/* SCAN BUTTON */

.scan-wrapper{
    position:relative;
}

.scan-button{
    position:absolute;

    left:50%;
    transform:translateX(-50%);

    bottom:7px;

    width:64px;
    height:64px;

    border-radius:50%;

    border:5px solid #f3f6f4;

    background:linear-gradient(
        135deg,
        #0d5c36,
        #23834d
    );

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 5px 15px rgba(0,0,0,.22);

    cursor:pointer;

    z-index:60;
}

.scan-button .nav-icon{
    font-size:25px;
}

.scan-button span{
    font-size:9px;
    font-weight:800;
}

/* SCANNER */

.scanner-overlay{
    position:fixed;
    inset:0;

    z-index:100;

    background:#000;

    display:none;

    flex-direction:column;
}

.scanner-header{
    height:64px;

    background:#0d5c36;

    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;
}

.scanner-title{
    font-size:17px;
    font-weight:800;
}

.close-scanner{
    border:none;

    background:rgba(255,255,255,.15);

    color:white;

    width:40px;
    height:40px;

    border-radius:50%;

    font-size:21px;

    cursor:pointer;
}

.scanner-body{
    position:relative;

    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.scan-frame{
    position:absolute;

    width:270px;
    height:270px;

    border:3px solid white;

    border-radius:20px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.35);

    pointer-events:none;
}

.scan-line{
    position:absolute;

    width:235px;
    height:2px;

    background:#22c55e;

    animation:scanLine 2s infinite;

    pointer-events:none;
}

@keyframes scanLine{

    0%{
        transform:translateY(-115px);
    }

    50%{
        transform:translateY(115px);
    }

    100%{
        transform:translateY(-115px);
    }

}

.scanner-info{
    position:absolute;

    bottom:35px;
    left:20px;
    right:20px;

    text-align:center;

    color:white;

    font-size:14px;

    font-weight:600;

    text-shadow:
        0 2px 5px #000;

    pointer-events:none;
}

/* HASIL */

.scan-result{
    position:fixed;
    inset:0;

    z-index:120;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.65);

    padding:20px;
}

.result-box{
    width:100%;
    max-width:400px;

    background:white;

    border-radius:20px;

    padding:25px;

    text-align:center;

    box-shadow:
        0 10px 35px rgba(0,0,0,.25);
}

.result-icon{
    font-size:48px;
    margin-bottom:12px;
}

.result-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:8px;
}

.result-text{
    font-size:14px;
    color:#64748b;

    word-break:break-word;

    margin-bottom:20px;
}

.result-button{
    width:100%;

    border:none;

    background:#0d5c36;

    color:white;

    padding:14px;

    border-radius:12px;

    font-weight:800;

    cursor:pointer;
}

/* MENU */

.menu-overlay{
    position:fixed;
    inset:0;

    z-index:90;

    background:rgba(0,0,0,.45);

    display:none;

    align-items:flex-end;
}

.menu-sheet{
    width:100%;
    max-width:600px;

    margin:auto;

    background:white;

    border-radius:22px 22px 0 0;

    padding:20px;
}

.menu-sheet h2{
    font-size:19px;
    margin-bottom:15px;
}

.panel-item{
    width:100%;

    border:none;

    background:#f3f6f4;

    padding:15px;

    border-radius:13px;

    margin-bottom:10px;

    text-align:left;

    font-size:14px;

    font-weight:700;

    cursor:pointer;
}

.panel-close{
    background:#0d5c36;
    color:white;
}

@media(max-width:380px){

    .menu-card{
        min-height:95px;
        padding:14px 8px;
    }

    .menu-name{
        font-size:12px;
    }

}

</style>

</head>

<script>

/* =====================================================
   URL APLIKASI
===================================================== */

const URL_DATA_OLAH =
    "https://ariefprastyo102-tech.github.io/scan-kayu/index-olah.html";

const URL_MUTASI_BBI =
    "https://ariefprastyo102-tech.github.io/scan-kayu/persediaan.html";

const URL_PERSEDIAAN_RST =
    "https://ariefprastyo102-tech.github.io/Persediaan-RST/";

const URL_MUTASI_RST =
    "https://ariefprastyo102-tech.github.io/Persediaan-RST/mutasi-rst.html";

const URL_ENTRY_RST =
    "https://ariefprastyo102-tech.github.io/Kalkulator-RST/";

const URL_BARCODE_REGISTER =
    "https://ariefprastyo102-tech.github.io/scan-kayu/barcode.html";

const URL_BARCODE_TUMPUK =
    "https://ariefprastyo102-tech.github.io/scan-kayu/cetak-barcode-tumpuk.html";


/* =====================================================
   SCANNER
===================================================== */

let codeReader = null;
let scannerRunning = false;
let scanLocked = false;
let scanSession = 0;


/* =====================================================
   RESET SCANNER
===================================================== */

function resetScannerState(){

    scannerRunning = false;
    scanLocked = false;

    if(codeReader){

        try{
            codeReader.reset();
        }
        catch(e){}

        codeReader = null;
    }

    const video =
        document.getElementById("video");

    if(video){

        try{

            video.pause();

            if(video.srcObject){

                video.srcObject
                    .getTracks()
                    .forEach(function(track){

                        try{
                            track.stop();
                        }
                        catch(e){}

                    });

            }

            video.srcObject = null;

        }
        catch(e){}

    }

    const overlay =
        document.getElementById("scannerOverlay");

    if(overlay){

        overlay.style.display = "none";

    }

}


/* =====================================================
   PAGESHOW
===================================================== */

window.addEventListener(
    "pageshow",
    function(event){

        resetScannerState();

        scanLocked = false;
        scannerRunning = false;

        const hasil =
            document.getElementById("scanResult");

        if(hasil){
            hasil.style.display = "none";
        }

        const menu =
            document.getElementById("menuOverlay");

        if(menu){
            menu.style.display = "none";
        }

        if(event.persisted){

            window.location.reload();

        }

    }
);


/* =====================================================
   HOME
===================================================== */

function bukaHome(){

    resetScannerState();

    document.getElementById(
        "menuOverlay"
    ).style.display = "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   MENU UTAMA
===================================================== */

function bukaMenuUtama(nama){

    let link = null;


    if(nama === "DATA OLAH"){

        link =
            URL_DATA_OLAH;

    }


    else if(nama === "MUTASI BBI"){

        link =
            URL_MUTASI_BBI;

    }


    else if(nama === "PERSEDIAAN RST"){

        link =
            URL_PERSEDIAAN_RST;

    }


    else if(nama === "MUTASI RST"){

        link =
            URL_MUTASI_RST;

    }


    else if(nama === "ENTRY RST"){

        link =
            URL_ENTRY_RST;

    }


    else if(nama === "BARCODE REGISTER"){

        link =
            URL_BARCODE_REGISTER;

    }


    else if(nama === "BARCODE TUMPUK"){

        link =
            URL_BARCODE_TUMPUK;

    }


    if(link){

        console.log(
            "BUKA MENU:",
            nama,
            link
        );

        window.location.assign(
            link
        );

        return;

    }


    alert(
        nama +
        "\n\nBelum dihubungkan."
    );

}


/* =====================================================
   BUKA SCANNER
===================================================== */

function bukaScanner(){

    console.log(
        "BUKA SCANNER BARU"
    );


    resetScannerState();


    const hasilScan =
        document.getElementById("hasilScan");

    if(hasilScan){
        hasilScan.style.display = "none";
    }


    const scannerOverlay =
        document.getElementById("scannerOverlay");

    if(scannerOverlay){
        scannerOverlay.style.display = "flex";
    }


    scanLocked = false;
    scannerRunning = false;


    codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


    const video =
        document.getElementById("video");


    navigator.mediaDevices
        .getUserMedia({

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            }

        })

        .then(function(stream){

            video.srcObject =
                stream;

            video.setAttribute(
                "playsinline",
                true
            );

            video.setAttribute(
                "muted",
                true
            );

            video.play();

            scannerRunning = true;


            codeReader.decodeFromVideoElement(
                video,

                function(result,error){

                    if(!scannerRunning){
                        return;
                    }

                    if(scanLocked){
                        return;
                    }


                    if(result){

                        scanLocked = true;

                        const teks =
                            result.getText();


                        console.log(
                            "HASIL SCAN:",
                            teks
                        );


                        console.log(
                            "FORMAT BARCODE:",
                            result.getBarcodeFormat
                                ? result.getBarcodeFormat()
                                : "TIDAK TERSEDIA"
                        );


                        scannerBerhasil(
                            teks
                        );

                    }

                }
            );

        })

        .catch(function(error){

            console.error(
                "ERROR KAMERA:",
                error
            );

            resetScannerState();

            alert(
                "Kamera tidak dapat dibuka."
            );

        });

}


/* =====================================================
   DETEKSI QR
===================================================== */

function deteksiJenisQR(teks){

    const nilai =
        String(teks || "").trim();


    if(/^\d{7}$/.test(nilai)){

        return "REGISTER";

    }


    try{

        const url =
            new URL(nilai);

        const register =
            url.searchParams.get("register");


        if(
            register &&
            /^\d{7}$/.test(register)
        ){

            return "REGISTER";

        }

    }
    catch(e){}


    const upper =
        nilai.toUpperCase();


    if(
        upper.startsWith("TUMPUK|") ||
        upper.startsWith("TPK|") ||
        upper.includes("CEK-TUMPUK") ||
        upper.includes("CEK_TUMPUK") ||
        upper.includes("TUMPUK=")
    ){

        return "TUMPUK";

    }


    return "TIDAK DIKENAL";

}


/* =====================================================
   HASIL SCAN
===================================================== */

function scannerBerhasil(teks){

    const nilai =
        String(teks || "").trim();


    console.log(
        "HASIL SCAN:",
        nilai
    );


    resetScannerState();


    /* =================================================
       CODE 128 REGISTER
    ================================================= */

    if(
        /^\d{7}$/.test(nilai)
    ){

        const urlRegister =
            "https://ariefprastyo102-tech.github.io/scan-kayu/index-test-qr?register=" +
            encodeURIComponent(nilai);


        console.log(
            "REGISTER CODE 128:",
            nilai
        );


        console.log(
            "BUKA SCAN REGISTER:",
            urlRegister
        );


        window.location.assign(
            urlRegister
        );


        return;

    }


    /* =================================================
       QR REGISTER
    ================================================= */

    try{

        const url =
            new URL(nilai);


        const register =
            url.searchParams.get("register");


        if(
            register &&
            /^\d{7}$/.test(register)
        ){

            console.log(
                "QR REGISTER:",
                register
            );


            window.location.assign(
                nilai
            );


            return;

        }

    }
    catch(e){}


    /* =================================================
       QR TUMPUK
    ================================================= */

    try{

        const url =
            new URL(nilai);


        const pathname =
            url.pathname.toLowerCase();


        const tpk =
            url.searchParams.get("tpk");


        const tumpuk =
            url.searchParams.get("tumpuk");


        if(
            pathname.includes("cek-tumpuk.html") &&
            tpk &&
            tumpuk
        ){

            console.log(
                "QR TUMPUK:",
                tpk,
                tumpuk
            );


            window.location.assign(
                nilai
            );


            return;

        }

    }
    catch(e){}


    /* =================================================
       FORMAT TUMPUK LAIN
    ================================================= */

    const upper =
        nilai.toUpperCase();


    if(
        upper.startsWith("TUMPUK|") ||
        upper.startsWith("TPK|") ||
        upper.includes("CEK-TUMPUK") ||
        upper.includes("CEK_TUMPUK") ||
        upper.includes("TUMPUK=")
    ){

        alert(
            "QR TUMPUK TERBACA.\n\n" +
            nilai
        );


        return;

    }


    /* =================================================
       TIDAK DIKENALI
    ================================================= */

    alert(
        "QR / BARCODE TIDAK DIKENALI.\n\n" +
        nilai
    );

}


/* =====================================================
   TUTUP SCANNER
===================================================== */

function tutupScanner(){

    resetScannerState();

    scanLocked = false;
    scannerRunning = false;


    const hasil =
        document.getElementById("scanResult");


    if(hasil){

        hasil.style.display =
            "none";

    }


    const scanner =
        document.getElementById("scannerOverlay");


    if(scanner){

        scanner.style.display =
            "none";

    }


    console.log(
        "SCANNER DITUTUP - STATE LAMA DIHAPUS"
    );

}


/* =====================================================
   HASIL SCAN
===================================================== */

function tampilkanHasilScan(
    jenis,
    teks
){

    resetScannerState();


    let icon =
        "❓";


    let title =
        "QR TIDAK DIKENALI";


    if(
        jenis === "REGISTER"
    ){

        icon =
            "📦";


        title =
            "REGISTER TERBACA";

    }


    if(
        jenis === "TUMPUK"
    ){

        icon =
            "🏗️";


        title =
            "TUMPUK TERBACA";

    }


    document.getElementById(
        "resultIcon"
    ).textContent =
        icon;


    document.getElementById(
        "resultTitle"
    ).textContent =
        title;


    document.getElementById(
        "resultText"
    ).textContent =
        "ISI QR:\n" +
        teks;


    document.getElementById(
        "scanResult"
    ).style.display =
        "flex";

}


/* =====================================================
   TUTUP HASIL
===================================================== */

function tutupHasilScan(){

    document.getElementById(
        "scanResult"
    ).style.display =
        "none";


    resetScannerState();

}

    document.getElementById(
        "menuOverlay"
    ).style.display =

}


function tutupMenuPanel(event){

    if(
        event &&
        event.target !== event.currentTarget
    ){

        return;

    }


    document.getElementById(
        "menuOverlay"
    ).style.display =
        "none";

}
