<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SUPER APP</title>

<!-- ZXING -->
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#1f2937;
}

.app{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:#f3f6f4;
    padding-bottom:90px;
}

/* =========================
   HEADER
========================= */

.header{
    background:linear-gradient(
        135deg,
        #0d5c36,
        #176b3a,
        #23834d
    );

    color:white;

    padding:22px 20px 24px;

    border-radius:0 0 22px 22px;

    box-shadow:
        0 6px 18px rgba(0,0,0,.12);
}

.header small{
    font-size:12px;
    opacity:.85;
}

.header h1{
    margin-top:5px;
    font-size:27px;
    font-weight:800;
}

.header p{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}

/* =========================
   CONTENT
========================= */

.content{
    padding:20px 16px;
}

.section-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:14px;
}

/* =========================
   MENU
========================= */

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.menu-card{
    border:none;
    background:white;
    border-radius:17px;
    padding:18px 13px;
    min-height:105px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:9px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.07);

    cursor:pointer;

    transition:.15s;
}

.menu-card:active{
    transform:scale(.96);
}

.menu-icon{
    font-size:30px;
}

.menu-name{
    text-align:center;
    font-size:13px;
    font-weight:700;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    z-index:50;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    max-width:600px;

    height:72px;

    background:white;

    display:grid;
    grid-template-columns:1fr 1fr 1fr;

    border-top:1px solid #e5e7eb;

    box-shadow:
        0 -4px 18px rgba(0,0,0,.08);
}

.nav-item{
    border:none;
    background:none;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    color:#64748b;

    font-size:11px;
    font-weight:700;

    cursor:pointer;
}

.nav-icon{
    font-size:21px;
}

/* =========================
   SCAN BUTTON
========================= */

.scan-wrapper{
    position:relative;
}

.scan-button{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    bottom:7px;

    width:64px;
    height:64px;

    border-radius:50%;

    border:5px solid #f3f6f4;

    background:linear-gradient(
        135deg,
        #0d5c36,
        #23834d
    );

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 5px 15px rgba(0,0,0,.22);

    cursor:pointer;

    z-index:60;
}

.scan-button .nav-icon{
    font-size:25px;
}

.scan-button span{
    font-size:9px;
    font-weight:800;
}

/* =========================
   SCANNER
========================= */

.scanner-overlay{
    position:fixed;
    inset:0;

    z-index:100;

    background:#000;

    display:none;

    flex-direction:column;
}

.scanner-header{
    height:64px;

    background:#0d5c36;

    color:white;

    display:flex;
    align-items:center;

    justify-content:space-between;

    padding:0 18px;
}

.scanner-title{
    font-size:17px;
    font-weight:800;
}

.close-scanner{
    border:none;
    background:rgba(255,255,255,.15);

    color:white;

    width:40px;
    height:40px;

    border-radius:50%;

    font-size:21px;

    cursor:pointer;
}

.scanner-body{
    position:relative;

    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

#video{
    width:100%;
    height:100%;

    object-fit:cover;
}

.scan-frame{
    position:absolute;

    width:260px;
    height:260px;

    border:3px solid white;

    border-radius:20px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.35);
}

.scan-line{
    position:absolute;

    width:230px;
    height:2px;

    background:#22c55e;

    animation:scanLine 2s infinite;
}

@keyframes scanLine{

    0%{
        transform:translateY(-110px);
    }

    50%{
        transform:translateY(110px);
    }

    100%{
        transform:translateY(-110px);
    }

}

.scanner-info{
    position:absolute;

    bottom:35px;

    left:20px;
    right:20px;

    text-align:center;

    color:white;

    font-size:14px;

    text-shadow:
        0 2px 5px #000;
}

/* =========================
   MENU PANEL
========================= */

.menu-overlay{
    position:fixed;
    inset:0;

    z-index:90;

    background:rgba(0,0,0,.45);

    display:none;

    align-items:flex-end;
}

.menu-sheet{
    width:100%;
    max-width:600px;

    margin:auto;

    background:white;

    border-radius:22px 22px 0 0;

    padding:20px;

    box-shadow:
        0 -8px 25px rgba(0,0,0,.15);
}

.menu-sheet h2{
    font-size:19px;
    margin-bottom:15px;
}

.panel-item{
    width:100%;

    border:none;

    background:#f3f6f4;

    padding:15px;

    border-radius:13px;

    margin-bottom:10px;

    text-align:left;

    font-size:14px;

    font-weight:700;

    cursor:pointer;
}

.panel-close{
    background:#0d5c36;
    color:white;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

    .menu-card{
        min-height:95px;
        padding:14px 8px;
    }

    .menu-name{
        font-size:12px;
    }

}

</style>

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <small>SELAMAT DATANG</small>

        <h1>SUPER APP</h1>

        <p>Sistem Operasional Terpadu</p>

    </header>


    <!-- CONTENT -->

    <main class="content">

        <div class="section-title">
            Menu Utama
        </div>


        <div class="menu-grid">

            <button
                class="menu-card"
                onclick="bukaMenuUtama('DATA OLAH')"
            >
                <div class="menu-icon">🪵</div>
                <div class="menu-name">DATA OLAH</div>
            </button>


            <button
                class="menu-card"
                onclick="bukaMenuUtama('MUTASI BBI')"
            >
                <div class="menu-icon">📊</div>
                <div class="menu-name">MUTASI BBI</div>
            </button>


            <button
                class="menu-card"
                onclick="bukaMenuUtama('PERSEDIAAN RST')"
            >
                <div class="menu-icon">📦</div>
                <div class="menu-name">PERSEDIAAN RST</div>
            </button>


            <button
                class="menu-card"
                onclick="bukaMenuUtama('MUTASI RST')"
            >
                <div class="menu-icon">📈</div>
                <div class="menu-name">MUTASI RST</div>
            </button>


            <button
                class="menu-card"
                onclick="bukaMenuUtama('ENTRY RST')"
            >
                <div class="menu-icon">📝</div>
                <div class="menu-name">ENTRY RST</div>
            </button>


            <button
                class="menu-card"
                onclick="bukaMenuUtama('BARCODE REGISTER')"
            >
                <div class="menu-icon">🔖</div>
                <div class="menu-name">BARCODE REGISTER</div>
            </button>


            <button
                class="menu-card"
                onclick="bukaMenuUtama('BARCODE TUMPUK')"
            >
                <div class="menu-icon">🏷️</div>
                <div class="menu-name">BARCODE TUMPUK</div>
            </button>

        </div>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            class="nav-item"
            onclick="bukaHome()"
        >
            <div class="nav-icon">🏠</div>
            <span>HOME</span>
        </button>


        <div class="scan-wrapper">

            <button
                class="scan-button"
                onclick="bukaScanner()"
            >

                <div class="nav-icon">📷</div>

                <span>SCAN</span>

            </button>

        </div>


        <button
            class="nav-item"
            onclick="bukaMenuPanel()"
        >
            <div class="nav-icon">☰</div>
            <span>MENU</span>
        </button>

    </nav>

</div>


<!-- =========================
     SCANNER
========================= -->

<div
    id="scannerOverlay"
    class="scanner-overlay"
>

    <div class="scanner-header">

        <div class="scanner-title">
            SCANNER
        </div>

        <button
            class="close-scanner"
            onclick="tutupScanner()"
        >
            ✕
        </button>

    </div>


    <div class="scanner-body">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>


        <div class="scan-frame"></div>

        <div class="scan-line"></div>


        <div class="scanner-info">
            Arahkan kamera ke QR REGISTER atau QR TUMPUK
        </div>

    </div>

</div>


<!-- =========================
     MENU PANEL
========================= -->

<div
    id="menuOverlay"
    class="menu-overlay"
    onclick="tutupMenuPanel(event)"
>

    <div
        class="menu-sheet"
        onclick="event.stopPropagation()"
    >

        <h2>MENU</h2>


        <button
            class="panel-item"
            onclick="bukaOperasional()"
        >
            🔧 OPERASIONAL
        </button>


        <button
            class="panel-item"
            onclick="bukaPengaturan()"
        >
            ⚙️ PENGATURAN
        </button>


        <button
            class="panel-item"
            onclick="bukaTentang()"
        >
            ℹ️ TENTANG APLIKASI
        </button>


        <button
            class="panel-item panel-close"
            onclick="tutupMenuPanel()"
        >
            TUTUP
        </button>

    </div>

</div>


<script>

/* =====================================================
   GLOBAL SCANNER
===================================================== */

let codeReader = null;

let scannerRunning = false;


/* =====================================================
   HOME
===================================================== */

function bukaHome(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   MENU UTAMA
===================================================== */

function bukaMenuUtama(nama){

    alert(
        nama +
        "\n\nBelum dihubungkan."
    );

}


/* =====================================================
   BUKA SCANNER
===================================================== */

async function bukaScanner(){

    const overlay =
        document.getElementById(
            "scannerOverlay"
        );

    overlay.style.display =
        "flex";


    try{

        codeReader =
            new ZXingBrowser.BrowserQRCodeReader();

        scannerRunning = true;


        const video =
            document.getElementById("video");


        await codeReader.decodeFromVideoDevice(
            undefined,
            video,
            (result, error) => {

                if(!scannerRunning){
                    return;
                }


                if(result){

                    scannerBerhasil(
                        result.getText()
                    );

                }

            }
        );

    }
    catch(error){

        console.error(error);

        alert(
            "Kamera tidak dapat dibuka.\n\n" +
            "Pastikan izin kamera sudah diberikan."
        );

        tutupScanner();

    }

}


/* =====================================================
   HASIL SCAN
===================================================== */

function scannerBerhasil(teks){

    if(!teks){
        return;
    }


    scannerRunning = false;


    if(codeReader){

        try{

            codeReader.reset();

        }
        catch(e){}

    }


    console.log(
        "HASIL SCAN:",
        teks
    );


    /*
       UNTUK SEMENTARA
       KITA TAMPILKAN HASIL QR.

       NANTI DI LANGKAH BERIKUTNYA
       KITA BUAT DETEKSI:

       REGISTER
       ↓
       SCAN REGISTER

       TUMPUK
       ↓
       CEK TUMPUK
    */

    alert(
        "QR TERBACA\n\n" +
        teks
    );

}


/* =====================================================
   TUTUP SCANNER
===================================================== */

function tutupScanner(){

    scannerRunning = false;


    if(codeReader){

        try{

            codeReader.reset();

        }
        catch(e){}

        codeReader = null;

    }


    const video =
        document.getElementById("video");


    if(video.srcObject){

        video.srcObject
            .getTracks()
            .forEach(
                track => track.stop()
            );

        video.srcObject = null;

    }


    document.getElementById(
        "scannerOverlay"
    ).style.display = "none";

}


/* =====================================================
   MENU PANEL
===================================================== */

function bukaMenuPanel(){

    document.getElementById(
        "menuOverlay"
    ).style.display = "flex";

}


function tutupMenuPanel(event){

    if(
        event &&
        event.target !== event.currentTarget
    ){

        return;

    }


    document.getElementById(
        "menuOverlay"
    ).style.display = "none";

}


/* =====================================================
   OPERASIONAL
===================================================== */

function bukaOperasional(){

    alert(
        "OPERASIONAL\n\n" +
        "SCAN REGISTER\n" +
        "CEK TUMPUK"
    );

}


/* =====================================================
   PENGATURAN
===================================================== */

function bukaPengaturan(){

    alert(
        "PENGATURAN\n\n" +
        "Belum tersedia."
    );

}


/* =====================================================
   TENTANG
===================================================== */

function bukaTentang(){

    alert(
        "SUPER APP\n\n" +
        "Sistem Operasional Terpadu"
    );

}

</script>

</body>
</html>
